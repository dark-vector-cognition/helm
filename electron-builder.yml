appId: com.helm.mission-control
productName: HELM
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asar: true
asarUnpack:
  - resources/**
extraResources:
  - from: src/main/data
    to: app-resources/data
  - from: src/main/hive/roles
    to: app-resources/hive/roles
  - from: src/main/sentinel
    to: app-resources/sentinel
    filter:
      - config.json
  - from: src/main/monitors
    to: app-resources/monitors
    filter:
      - lulu-parser.py
win:
  executableName: helm-light
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Developer ID signing. A missing identity fails the build instead of shipping unsigned.
  identity: Dark Vector Cognition LLC (WA6GHCR9GV)
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSAppleEventsUsageDescription: HELM opens Terminal to attach to agent sessions.
  # Notarization runs only when APPLE_KEYCHAIN_PROFILE is set (notarytool keychain profile).
  # scripts/build-mac-release.sh sets it, defaulting to helm-notary. No credentials live here.
  notarize: true
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
  sign: true
linux:
  target:
    - AppImage
  maintainer: Dark Vector Cognition LLC
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
