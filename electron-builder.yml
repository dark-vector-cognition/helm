appId: com.helm.mission-control
productName: HELM
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asar: true
asarUnpack:
  - resources/**
extraResources:
  - from: src/main/data
    to: app-resources/data
  - from: src/main/hive/roles
    to: app-resources/hive/roles
  - from: src/main/sentinel
    to: app-resources/sentinel
    filter:
      - config.json
  - from: src/main/monitors
    to: app-resources/monitors
    filter:
      - lulu-parser.py
win:
  executableName: helm
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.developer-tools
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: kunalnano
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
