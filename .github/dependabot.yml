version: 2
updates:
  # Security updates only (version updates stay off), as one grouped PR
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
