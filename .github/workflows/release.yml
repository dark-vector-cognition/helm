name: Release

# A tag push does not publish anything. This workflow runs only by hand, and it uploads a DMG
# only after the DMG passes Developer ID, notarization and stapler checks. It needs these
# repository secrets: MAC_CSC_LINK and MAC_CSC_KEY_PASSWORD (the Developer ID certificate), and
# APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER (an App Store Connect API key for
# notarytool). Without all five, the secrets check fails and nothing is published. Until CI
# signing exists, build the release on a Mac with scripts/build-mac-release.sh and attach the
# verified DMG to the release by hand.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v6.0.0'
        required: true

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag name
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag must look like v6.0.0. Got: $TAG"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Confirm the tag and release notes exist
        run: |
          git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null || { echo "Tag $TAG does not exist."; exit 1; }
          test -f "docs/releases/$TAG.md" || { echo "docs/releases/$TAG.md is missing."; exit 1; }

      - name: Check signing secrets
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=0
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Write the notary API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/notary/AuthKey.p8"
          mkdir -p "$(dirname "$key")"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder signs the app and the DMG, and notarizes and staples the app only.
      - name: Build & package
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run build && npx electron-builder --mac dmg --arm64 --publish never

      - name: Notarize and staple the DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if [[ ${#dmgs[@]} -eq 0 ]]; then
            echo "No DMG was built."
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
          done

      - name: Verify signing and notarization
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if [[ ${#dmgs[@]} -eq 0 ]]; then
            echo "No DMG was built."
            exit 1
          fi
          xcrun stapler validate dist/mac-arm64/HELM.app
          spctl -a -vv dist/mac-arm64/HELM.app 2>&1 | tee spctl-app.log
          grep -q 'source=Notarized Developer ID' spctl-app.log
          for dmg in "${dmgs[@]}"; do
            codesign --verify --strict --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
            spctl -a -vv -t open --context context:primary-signature "$dmg" 2>&1 | tee spctl.log
            grep -q 'source=Notarized Developer ID' spctl.log
          done

      - name: Remove the notary API key
        if: always()
        run: rm -f "$RUNNER_TEMP/notary/AuthKey.p8"

      - name: Upload artifacts to a draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body_path: docs/releases/${{ inputs.tag }}.md
          files: dist/*.dmg
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
