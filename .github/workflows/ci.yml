name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 for Node
        run: npm run rebuild:node

      - name: Test Cursor hook adapter
        run: npm run test:agent-hooks

      - name: Run tests
        run: npx vitest --run

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx electron-vite build
